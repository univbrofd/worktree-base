name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPCS (WPCS)
        run: vendor/bin/phpcs --standard=config/phpcs.xml.dist
      - name: PHPStan
        run: vendor/bin/phpstan analyse -c config/phpstan.neon.dist --no-progress

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app/themes/clone-theme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/app/themes/clone-theme/package-lock.json
      - run: npm ci
      - run: npm run build
